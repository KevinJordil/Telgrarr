name: TELGRARR CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies (Root / Backend)
        run: npm ci

      - name: Install Dependencies (Frontend GUI)
        run: cd gui && npm ci

      - name: Security Audit (Report Only)
        run: npm audit || true
        
      - name: Run Linter (if present)
        run: npm run lint --if-present

      - name: Typecheck (tsc --noEmit on opt-in // @ts-check files)
        run: npm run typecheck

      - name: Run Unit & Parity Tests (Vitest)
        run: npm run test:run

      - name: Build Frontend GUI
        run: cd gui && npm run build

      - name: Install Playwright Chromium & OS Deps
        run: npx playwright install --with-deps chromium

      - name: Run E2E Smoke Tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-validate:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build Docker Image (no cache, proves clean-environment portability)
        run: docker build --no-cache -t telgrarr:ci .

      - name: Boot Container (bare docker run, no compose)
        run: |
          docker run -d --name telgrarr-smoke \
            -p 3400:3400 \
            -e RESTART_CAPABLE=0 \
            --health-cmd="wget -q -O /dev/null http://127.0.0.1:3400/health/live || exit 1" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=3 \
            --health-start-period=20s \
            telgrarr:ci

      - name: Show Effective Healthcheck (permanent diagnostic)
        run: docker inspect --format='{{json .Config.Healthcheck}}' telgrarr-smoke

      - name: Wait for Healthy Status (bare run)
        run: |
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' telgrarr-smoke 2>/dev/null)
            echo "poll[$i]=$STATUS"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "Container never became healthy"
          docker logs telgrarr-smoke
          exit 1

      - name: External Health Check (bare run)
        run: |
          curl -fsS http://127.0.0.1:3400/health/live
          HTTP=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3400/health)
          cat /tmp/health.json; echo
          [ "$HTTP" = "503" ] || { echo "Expected deep /health HTTP 503 (unconfigured); got $HTTP"; exit 1; }
          grep -q '"status":"degraded"' /tmp/health.json || { echo "Expected degraded status in deep /health body"; exit 1; }

      - name: Confirm Non-Root Execution (Dockerfile UID 1000)
        run: |
          RUNTIME_UID=$(docker exec telgrarr-smoke id -u)
          echo "uid=$RUNTIME_UID"
          [ "$RUNTIME_UID" = "1000" ] || { echo "Expected UID 1000, got $RUNTIME_UID"; exit 1; }

      - name: Graceful Shutdown Check (SIGTERM, node as PID 1)
        run: |
          docker stop -t 10 telgrarr-smoke
          docker logs telgrarr-smoke | tail -30

      - name: Teardown Bare Container
        if: always()
        run: docker rm -f telgrarr-smoke || true

      - name: Prepare .env for Compose (documented first-run default, unmodified)
        run: cp .env.example .env

      - name: Compose Up (full stack, volume, network, RESTART_CAPABLE default)
        run: docker compose up -d --build

      - name: Wait for Healthy Status (compose)
        run: |
          for i in $(seq 1 50); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' telgrarr 2>/dev/null)
            echo "poll[$i]=$STATUS"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "Compose service never became healthy"
          docker compose logs
          exit 1

      - name: External Health Check (compose)
        run: |
          curl -fsS http://127.0.0.1:3400/health/live
          HTTP=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3400/health)
          cat /tmp/health.json; echo
          [ "$HTTP" = "503" ] || { echo "Expected deep /health HTTP 503 (unconfigured); got $HTTP"; exit 1; }
          grep -q '"status":"degraded"' /tmp/health.json || { echo "Expected degraded status in deep /health body"; exit 1; }

      - name: Confirm RESTART_CAPABLE Default-On (Master Architecture Section 7, F13g/FA-57)
        run: |
          VAL=$(docker compose exec -T telgrarr printenv RESTART_CAPABLE)
          echo "RESTART_CAPABLE=$VAL"
          [ "$VAL" = "1" ] || { echo "Expected RESTART_CAPABLE=1 by default"; exit 1; }

      - name: Confirm Named Volume Materialized
        run: docker volume inspect telgrarr-data

      - name: Confirm Named Network Materialized
        run: docker network inspect telgrarr-net

      - name: Teardown Compose Stack
        if: always()
        run: docker compose down -v

